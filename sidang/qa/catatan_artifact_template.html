<title>Catatan Persiapan Sidang</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane reader, index rail on the left (stacks on phone), one note at a time on the right. */
:root {
  --bg: #f6f7f4; --panel: #ffffff; --fg: #1d2420; --muted: #5b6760;
  --line: #d9ded8; --accent: #2f6b4f; --accent-soft: #e3efe8; --code: #eef1ec; --mark: #fff1b8;
  --ok: #2f7a3e; --ok-soft: #e2f1e4; --bad: #b3412e; --bad-soft: #f8e4df;
  --f-head: "IBM Plex Serif", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141916; --panel: #1b211d; --fg: #e3e8e4; --muted: #9aa69f;
  --line: #2e3631; --accent: #7cc39e; --accent-soft: #23332a; --code: #222a25; --mark: #5a4d14; --ok: #7fcf8e; --ok-soft: #1f3324; --bad: #f08a75; --bad-soft: #3a221d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141916; --panel: #1b211d; --fg: #e3e8e4; --muted: #9aa69f;
  --line: #2e3631; --accent: #7cc39e; --accent-soft: #23332a; --code: #222a25; --mark: #5a4d14; --ok: #7fcf8e; --ok-soft: #1f3324; --bad: #f08a75; --bad-soft: #3a221d; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); }
.wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; max-width: 1240px; margin: 0 auto;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 14px; min-width: 0; }
.brand h1 { font: 600 1.25rem/1.25 var(--f-head); margin: 0; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .82rem; }
#cari { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; }
#cari:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav { display: grid; gap: 14px; }
nav h2 { font: 600 .72rem/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav a { display: block; padding: 5px 8px; border-radius: 5px; color: var(--fg); text-decoration: none; font-size: .9rem; line-height: 1.35; }
nav a:hover { background: var(--accent-soft); }
nav a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .hits { color: var(--muted); font-size: .75rem; margin-left: 4px; font-variant-numeric: tabular-nums; }
main { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 28px clamp(16px, 4vw, 44px); }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
main > h1 { font: 600 1.6rem/1.2 var(--f-head); margin: 0 0 20px; text-wrap: balance; }
article { max-width: 74ch; }
article h1, article h2, article h3, article h4 { font-family: var(--f-head); line-height: 1.25; text-wrap: balance; margin: 1.6em 0 .5em; }
article h1 { font-size: 1.4rem; } article h2 { font-size: 1.22rem; } article h3 { font-size: 1.08rem; } article h4 { font-size: 1rem; color: var(--accent); }
article a { color: var(--accent); }
article code { font-family: var(--f-mono); font-size: .86em; background: var(--code); padding: .1em .3em; border-radius: 3px; overflow-wrap: anywhere; }
article pre { background: var(--code); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
article pre code { background: none; padding: 0; overflow-wrap: normal; }
article blockquote { margin: 1em 0; padding: .2em 1em; border-left: 3px solid var(--accent); color: var(--muted); }
.tbl { overflow-x: auto; margin: 1em 0; }
article table { border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
article th, article td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
article th { background: var(--accent-soft); }
article hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
article math[display="block"] { overflow-x: auto; margin: .8em 0; }
/* Diagram SVG di catatan: warna dari token supaya terbaca di tema terang dan gelap. */
.fig { margin: 1.4em 0; max-width: none; }
.fig-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--bg); }
.dg { display: block; width: 100%; min-width: 620px; height: auto; color: var(--fg); font-family: var(--f-body); }
.dg .pn { fill: var(--panel); stroke: var(--line); }
.dg .bx, .dg .cp { fill: var(--panel); stroke: var(--muted); stroke-width: 1; }
.dg .cp { fill: var(--code); stroke: var(--line); }
.dg .hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.dg .ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
.dg .bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.5; }
.dg .ln { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dg .ah { fill: var(--muted); }
.dg .h { font: 600 13px var(--f-body); fill: var(--fg); }
.dg .t { font-size: 12.5px; fill: var(--fg); }
.dg .c { font: 12px var(--f-mono); fill: var(--fg); }
.dg .s { font-size: 11px; fill: var(--muted); }
.fig figcaption { color: var(--muted); font-size: .85rem; margin-top: 8px; }
mark { background: var(--mark); color: inherit; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); }
.pager a { color: var(--accent); text-decoration: none; font-size: .9rem; max-width: 48%; }
.status { color: var(--muted); }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; max-height: none; }
  nav { max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap">
  <aside>
    <div class="brand">
      <h1>Catatan Persiapan Sidang</h1>
      <p>EDM-Fuzzy vs JSD-Fuzzy + ANN-LM, 4 sensor kelembaban tanah. Catatan internal, tidak untuk layar presentasi. <span id="versi"></span></p>
    </div>
    <label for="cari" class="eyebrow">Cari di semua catatan</label>
    <input id="cari" type="search" placeholder="mis. Holm, purge, neuron output" autocomplete="off">
    <nav id="nav" aria-label="Daftar catatan"><p class="status">Memuat daftar…</p></nav>
  </aside>
  <main>
    <p class="eyebrow" id="grup"></p>
    <h1 id="judul">Memuat catatan…</h1>
    <article id="isi"></article>
    <div class="pager" id="pager"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
let DOCS = [], cur = null;
const $ = (id) => document.getElementById(id);

function renderMd(md) {
  // Lindungi rumus dari parser markdown, ubah ke MathML (tanpa CSS KaTeX).
  const math = [];
  const simpan = (tex, display) => {
    let html;
    try { html = katex.renderToString(tex, { displayMode: display, output: "mathml", throwOnError: false }); }
    catch (e) { html = "<code>" + tex.replace(/</g, "&lt;") + "</code>"; }
    math.push(html); return "\u0000M" + (math.length - 1) + "\u0000";
  };
  const blok = md.split(/(```[\s\S]*?```|`[^`\n]*`)/g).map((bag, i) => {
    if (i % 2) return bag;                       // kode: biarkan
    return bag.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => simpan(t, true))
              .replace(/\$([^\$\n]+?)\$/g, (_, t) => simpan(t, false));
  }).join("");
  let html = marked.parse(blok, { mangle: false, headerIds: false });
  html = html.replace(/\u0000M(\d+)\u0000/g, (_, n) => math[+n]);
  return html.replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
}

function daftar(q) {
  const kata = q.trim().toLowerCase();
  const grup = {};
  DOCS.forEach((d, i) => {
    let hits = 0;
    if (kata) {
      const teks = (d.judul + "\n" + d.md).toLowerCase();
      let p = teks.indexOf(kata);
      while (p !== -1) { hits++; p = teks.indexOf(kata, p + kata.length); }
      if (!hits) return;
    }
    (grup[d.grup] = grup[d.grup] || []).push({ d, i, hits });
  });
  const nav = $("nav"); nav.innerHTML = "";
  const nama = Object.keys(grup);
  if (!nama.length) { nav.innerHTML = '<p class="status">Tidak ada catatan yang memuat kata itu.</p>'; return; }
  nama.forEach((g) => {
    const sec = document.createElement("section");
    sec.innerHTML = "<h2></h2><ol></ol>"; sec.querySelector("h2").textContent = g;
    grup[g].forEach(({ d, hits }) => {
      const li = document.createElement("li"); const a = document.createElement("a");
      a.href = "#" + d.id; a.textContent = d.judul;
      if (d.id === cur) a.setAttribute("aria-current", "true");
      if (hits) { const s = document.createElement("span"); s.className = "hits"; s.textContent = hits + "×"; a.append(s); }
      li.append(a); sec.querySelector("ol").append(li);
    });
    nav.append(sec);
  });
}

function sorot(el, kata) {
  if (!kata) return;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  const re = new RegExp(kata.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  nodes.forEach((n) => {
    if (!re.test(n.nodeValue) || n.parentElement.closest("math")) return;
    const span = document.createElement("span");
    span.innerHTML = n.nodeValue.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])).replace(re, (m) => "<mark>" + m + "</mark>");
    n.replaceWith(span);
  });
  const m = el.querySelector("mark"); if (m) m.scrollIntoView({ block: "center" });
}

function tampil() {
  const id = location.hash.slice(1);
  const i = Math.max(0, DOCS.findIndex((d) => d.id === id));
  const d = DOCS[i]; cur = d.id;
  $("grup").textContent = d.grup; $("judul").textContent = d.judul;
  $("isi").innerHTML = renderMd(d.md);
  const pg = $("pager"); pg.innerHTML = "";
  if (DOCS[i - 1]) { const a = document.createElement("a"); a.href = "#" + DOCS[i - 1].id; a.textContent = "← " + DOCS[i - 1].judul; pg.append(a); } else pg.append(document.createElement("span"));
  if (DOCS[i + 1]) { const a = document.createElement("a"); a.href = "#" + DOCS[i + 1].id; a.textContent = DOCS[i + 1].judul + " →"; a.style.textAlign = "right"; pg.append(a); }
  daftar($("cari").value);
  const kata = $("cari").value.trim();
  if (kata) sorot($("isi"), kata); else window.scrollTo(0, 0);
}

$("cari").addEventListener("input", () => daftar($("cari").value));
$("cari").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const a = $("nav").querySelector("a"); if (a) { if (location.hash === a.getAttribute("href")) tampil(); else location.hash = a.getAttribute("href"); } }
});
window.addEventListener("hashchange", tampil);

fetch("catatan.json").then((r) => r.json()).then((j) => {
  DOCS = j.docs; $("versi").textContent = "Dibangun dari commit " + j.commit + ".";
  tampil();
}).catch(() => { $("judul").textContent = "Catatan gagal dimuat"; $("isi").textContent = "File catatan.json tidak terbaca. Muat ulang halaman."; });
</script>
